<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Dubbed</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  background: #1b1b1b;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #aaa;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.search-box {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 15px;
  font-size: 17px;
  border: none;
  border-radius: 8px;
}

button {
  padding: 15px 25px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#results {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: #1e1e1e;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
}

.poster {
  width: 100%;
  height: 360px;
  object-fit: cover;
}

.card-content {
  padding: 18px;
}

.card h2 {
  margin-top: 0;
}

.card p {
  line-height: 1.5;
  color: #ddd;
}

.message,
.loading {
  grid-column: 1 / -1;
  text-align: center;
  color: #aaa;
  padding: 30px;
}

@media (max-width: 600px) {
  .search-box {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style></head><body><header>
  <h1>🎬 Animation Dubbed</h1>
  <p>Search anime in English, Japanese, Romaji and alternative names</p>
</header><div class="container">  <div class="search-box"><input
  type="text"
  id="searchInput"
  placeholder="Search any anime name..."
>

<button onclick="searchAnime()">Search</button>

  </div>  <h2>🔎 Search Results</h2>  <div id="results">
    <p class="message">Search for an anime above.</p>
  </div></div><script>

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}


async function searchAnime() {

  const input = document
    .getElementById("searchInput")
    .value
    .trim();

  const results =
    document.getElementById("results");


  if (!input) {

    results.innerHTML =
      '<p class="message">Please enter an anime name.</p>';

    return;

  }


  results.innerHTML =
    '<p class="loading">🔄 Searching anime...</p>';


  try {

    const url =
      "https://api.jikan.moe/v4/anime?q=" +
      encodeURIComponent(input) +
      "&limit=25";

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Unable to connect to anime database"
      );

    }


    const data =
      await response.json();


    let animeResults =
      data.data || [];


    /*
    Extra client-side matching:
    Checks title, English title,
    Japanese title and synonyms.
    */

    const query =
      input.toLowerCase();


    const exactMatches =
      animeResults.filter(anime => {

        const titles = [

          anime.title,

          anime.title_english,

          anime.title_japanese,

          ...(anime.titles || [])
            .map(item => item.title),

          ...(anime.title_synonyms || [])

        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return titles.includes(query);

      });


    /*
    Show exact/better matches first.
    */

    const otherMatches =
      animeResults.filter(
        anime =>
          !exactMatches.includes(anime)
      );


    animeResults = [
      ...exactMatches,
      ...otherMatches
    ];


    if (animeResults.length === 0) {

      results.innerHTML =
        '<p class="message">❌ Anime not found.</p>';

      return;

    }


    results.innerHTML = "";


    animeResults.forEach(anime => {

      const title =
        anime.title_english ||
        anime.title ||
        "Unknown";


      const japaneseTitle =
        anime.title_japanese ||
        "";


      const synonyms =
        anime.title_synonyms &&
        anime.title_synonyms.length
          ? anime.title_synonyms
              .slice(0, 5)
              .join(", ")
          : "Not available";


      const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";


      const genres =
        anime.genres &&
        anime.genres.length
          ? anime.genres
              .map(g => g.name)
              .join(", ")
          : "Not available";


      const episodes =
        anime.episodes ??
        "Unknown";


      const status =
        anime.status ||
        "Unknown";


      const score =
        anime.score ??
        "Not rated";


      const synopsis =
        anime.synopsis
          ? anime.synopsis
              .substring(0, 350) +
            (anime.synopsis.length > 350
              ? "..."
              : "")
          : "Description not available.";


      results.innerHTML += `

        <div class="card">

          ${
            image
              ? `
                <img
                  class="poster"
                  src="${image}"
                  alt="${escapeHTML(title)}"
                  loading="lazy"
                >
              `
              : ""
          }


          <div class="card-content">

            <h2>
              ${escapeHTML(title)}
            </h2>


            ${
              japaneseTitle
                ? `
                  <p>
                    <b>🇯🇵 Japanese:</b>
                    ${escapeHTML(japaneseTitle)}
                  </p>
                `
                : ""
            }


            <p>
              <b>🔄 Other names:</b>
              ${escapeHTML(synonyms)}
            </p>


            <p>
              <b>⭐ Rating:</b>
              ${score}
            </p>


            <p>
              <b>🎭 Genres:</b>
              ${escapeHTML(genres)}
            </p>


            <p>
              <b>📺 Episodes:</b>
              ${episodes}
            </p>


            <p>
              <b>📡 Status:</b>
              ${escapeHTML(status)}
            </p>


            <p>
              <b>📝 About:</b><br>
              ${escapeHTML(synopsis)}
            </p>


          </div>

        </div>

      `;

    });


  }


  catch (error) {

    console.error(error);


    results.innerHTML = `

      <p class="message">

        ❌ Anime data load nahi ho saka.<br><br>

        Thodi der baad dobara try karein.

      </p>

    `;

  }

}



document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchAnime();

      }

    }
  );

</script></body>
</html>
