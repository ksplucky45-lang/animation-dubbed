<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animation Dubbed</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  text-align: center;
  padding: 25px;
  background: #1c1c1c;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.search-box {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 15px;
  font-size: 17px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 15px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#results {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: #1e1e1e;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
}

.card img {
  width: 100%;
  height: 350px;
  object-fit: cover;
}

.info {
  padding: 15px;
}

.info h2 {
  margin-top: 0;
}

.message {
  text-align: center;
  padding: 30px;
  color: #aaa;
}

@media(max-width:600px) {
  .search-box {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
<h1>Animation Dubbed</h1>
<p>Search for your favorite anime</p>
</header>

<div class="container">

<div class="search-box">
<input id="searchInput" type="text" placeholder="Search anime...">
<button id="searchButton">Search</button>
</div>

<h2>🔎 Search Results</h2>

<div id="results">
<p class="message">Search for an anime above.</p>
</div>

</div>

<script>

const input = document.getElementById("searchInput");
const button = document.getElementById("searchButton");
const results = document.getElementById("results");

button.addEventListener("click", searchAnime);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    searchAnime();
  }
});

async function searchAnime() {

  const query = input.value.trim();

  if (!query) {
    results.innerHTML =
      '<p class="message">Please enter an anime name.</p>';
    return;
  }

  results.innerHTML =
    '<p class="message">Loading...</p>';

  try {

    const url =
      "https://api.jikan.moe/v4/anime?q=" +
      encodeURIComponent(query) +
      "&limit=8&sfw=true";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Search failed");
    }

    const json = await response.json();

    if (!json.data || json.data.length === 0) {
      results.innerHTML =
        '<p class="message">No anime found.</p>';
      return;
    }

    results.innerHTML = "";

    json.data.forEach(function(anime) {

      const title = anime.title || "Unknown";

      const image =
        anime.images &&
        anime.images.jpg &&
        anime.images.jpg.image_url
        ? anime.images.jpg.image_url
        : "";

      const genres =
        anime.genres && anime.genres.length
        ? anime.genres.map(g => g.name).join(", ")
        : "Not available";

      const synopsis =
        anime.synopsis || "No description available.";

      results.innerHTML += `

      <div class="card">

        ${image ? `<img src="${image}" alt="${title}">` : ""}

        <div class="info">

          <h2>${title}</h2>

          <p><b>Type:</b> ${anime.type || "Unknown"}</p>

          <p><b>Episodes:</b> ${anime.episodes || "Unknown"}</p>

          <p><b>Status:</b> ${anime.status || "Unknown"}</p>

          <p><b>Genre:</b> ${genres}</p>

          <p><b>Score:</b> ${anime.score || "N/A"}</p>

          <p><b>About:</b> ${synopsis}</p>

        </div>

      </div>

      `;

    });

  }

  catch (error) {

    console.error(error);

    results.innerHTML =
      '<p class="message">Unable to load anime right now. Please try again.</p>';

  }

}

</script>

</body>
</html>
