<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animation Dubbed</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #1b1b1b;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ff0055;
    }

    h1 {
      color: #ff0055;
      font-size: 32px;
    }

    header p {
      color: #ccc;
      margin-top: 8px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      margin: 25px 15px;
    }

    input {
      width: 70%;
      max-width: 500px;
      padding: 14px;
      border: none;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 22px;
      border: none;
      background: #ff0055;
      color: white;
      cursor: pointer;
      font-size: 16px;
      border-radius: 0 8px 8px 0;
    }

    button:hover {
      background: #cc0044;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
      color: #ff0055;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.3s;
      text-align: center;
      padding-bottom: 15px;
    }

    .anime-card:hover {
      transform: scale(1.04);
    }

    .anime-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .anime-card h3 {
      padding: 12px 8px 5px;
    }

    .anime-card p {
      color: #bbb;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 30px;
      background: #1b1b1b;
      color: #aaa;
    }

    @media(max-width: 500px) {
      h1 {
        font-size: 25px;
      }

      input {
        width: 65%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 Animation Dubbed</h1>
  <p>Watch and discover your favorite anime</p>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search anime...">
  <button onclick="searchAnime()">Search</button>
</div>

<div class="container">

  <h2>🔥 Popular Anime</h2>

  <div class="anime-grid" id="animeGrid">

    <div class="anime-card">
      <img src="https://placehold.co/300x400?text=One+Piece" alt="One Piece">
      <h3>One Piece</h3>
      <p>Adventure • Action</p>
    </div>

    <div class="anime-card">
      <img src="https://placehold.co/300x400?text=Naruto" alt="Naruto">
      <h3>Naruto</h3>
      <p>Action • Ninja</p>
    </div>

    <div class="anime-card">
      <img src="https://placehold.co/300x400?text=Dragon+Ball" alt="Dragon Ball">
      <h3>Dragon Ball</h3>
      <p>Action • Fantasy</p>
    </div>

    <div class="anime-card">
      <img src="https://placehold.co/300x400?text=Attack+on+Titan" alt="Attack on Titan">
      <h3>Attack on Titan</h3>
      <p>Action • Dark Fantasy</p>
    </div>

    <div class="anime-card">
      <img src="https://placehold.co/300x400?text=Demon+Slayer" alt="Demon Slayer">
      <h3>Demon Slayer</h3>
      <p>Action • Adventure</p>
    </div>

  </div>

</div>

<footer>
  © 2026 Animation Dubbed
</footer>

<script>
function searchAnime() {

  let input = document.getElementById("searchInput").value.toLowerCase();

  let cards = document.querySelectorAll(".anime-card");

  cards.forEach(card => {

    let name = card.querySelector("h3").innerText.toLowerCase();

    if (name.includes(input)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }

  });

}
</script>

</body>
</html>
