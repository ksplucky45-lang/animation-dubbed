<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <link rel="icon" type="image/png" href="file_0000000041888211a93007c8a6a91a2f.png">  <title>Animation Dubbed</title>  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111;
      color:white;
    }

    header{
      background:#1c1c1c;
      padding:12px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:10;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      color:#ffcc00;
      font-size:22px;
      font-weight:bold;
    }

    .logo img{
      width:45px;
      height:45px;
      border-radius:50%;
      object-fit:cover;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:15px;
    }

    .hero{
      padding:60px 7%;
      text-align:center;
      background:linear-gradient(135deg,#161616,#292929);
    }

    .hero h1{
      font-size:40px;
      color:#ffcc00;
    }

    .hero p{
      color:#bbb;
      margin:15px 0;
    }

    .search-box{
      width:90%;
      max-width:600px;
      margin:20px auto;
      display:flex;
      gap:8px;
    }

    .search{
      flex:1;
      padding:14px;
      border:none;
      border-radius:25px;
      font-size:16px;
    }

    button{
      border:none;
      padding:14px 22px;
      border-radius:25px;
      background:#ffcc00;
      font-weight:bold;
      cursor:pointer;
    }

    .section{
      padding:30px 7%;
    }

    .section h2{
      margin-bottom:20px;
      color:#ffcc00;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:18px;
    }

    .card{
      background:#222;
      border-radius:10px;
      overflow:hidden;
      transition:.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
      display:block;
    }

    .card h3{
      padding:12px 12px 5px;
      font-size:16px;
    }

    .card p{
      padding:5px 12px 15px;
      color:#aaa;
      font-size:13px;
    }

    #message{
      text-align:center;
      color:#bbb;
      padding:20px;
      font-size:16px;
    }

    footer{
      background:#1c1c1c;
      text-align:center;
      padding:25px;
      margin-top:30px;
      color:#888;
    }

    @media(max-width:600px){
      nav{
        display:none;
      }

      .hero h1{
        font-size:30px;
      }

      .search-box{
        flex-direction:column;
      }
    }
  </style></head><body><header>
  <div class="logo">
    <img src="file_0000000041888211a93007c8a6a91a2f.png" alt="Animation Dubbed Logo">
    <span>Animation Dubbed</span>
  </div>  <nav>
    <a href="#">Home</a>
    <a href="#results">Search</a>
  </nav>
</header><section class="hero">
  <h1>Animation Dubbed</h1>
  <p>Search for your favorite anime.</p>  <div class="search-box">
    <input
      class="search"
      id="searchInput"
      type="text"
      placeholder="🔍 Search anime... Example: Naruto"
    ><button onclick="searchAnime()">Search</button>

  </div>
</section><section class="section" id="results">
  <h2>🔎 Search Results</h2>  <div id="message">
    Search for an anime above.
  </div>  <div class="cards" id="resultsContainer"></div>
</section><footer>
  <p>© 2026 Animation Dubbed</p>
</footer><script>
const input = document.getElementById("searchInput");

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    searchAnime();
  }
});

async function searchAnime() {
  const query = input.value.trim();
  const container = document.getElementById("resultsContainer");
  const message = document.getElementById("message");

  if (!query) {
    message.textContent = "Please enter an anime name.";
    container.innerHTML = "";
    return;
  }

  message.textContent = "Searching...";
  container.innerHTML = "";

  try {
    const url =
      "https://api.jikan.moe/v4/anime?q=" +
      encodeURIComponent(query) +
      "&limit=12&sfw=true";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Search failed");
    }

    const result = await response.json();

    if (!result.data || result.data.length === 0) {
      message.textContent = "No anime found.";
      return;
    }

    message.textContent = "Results for: " + query;

    result.data.forEach(function(anime) {
      const image =
        anime.images &&
        anime.images.jpg &&
        anime.images.jpg.image_url
          ? anime.images.jpg.image_url
          : "";

      const title = anime.title || "Unknown title";
      const type = anime.type || "Anime";
      const episodes =
        anime.episodes ? anime.episodes + " episodes" : "Episodes unknown";

      container.innerHTML += `
        <div class="card">
          <img src="${image}" alt="${title}">
          <h3>${title}</h3>
          <p>${type} • ${episodes}</p>
        </div>
      `;
    });

  } catch (error) {
    message.textContent =
      "Search could not load. Please check your internet and try again.";
  }
}
</script></body>
</html>
