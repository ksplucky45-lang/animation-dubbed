<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Animation Dubbed</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  background: #1b1b1b;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #aaa;
  margin-bottom: 0;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.search-box {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 15px;
  font-size: 17px;
  border: none;
  border-radius: 8px;
}

button {
  padding: 15px 25px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

#results {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: #1e1e1e;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
}

.poster {
  width: 100%;
  height: 350px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 18px;
}

.card h2 {
  margin-top: 0;
  font-size: 22px;
}

.card p {
  line-height: 1.6;
  color: #ddd;
}

.message {
  grid-column: 1 / -1;
  text-align: center;
  color: #aaa;
  padding: 25px;
}

.loading {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 18px;
  padding: 30px;
}

@media (max-width: 600px) {

  .search-box {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .poster {
    height: 400px;
  }

}
</style></head><body><header>
  <h1>🎬 Animation Dubbed</h1>
  <p>Search for your favorite anime</p>
</header><div class="container">  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search anime name..."
    ><button onclick="searchAnime()">Search</button>

  </div>  <h2>🔎 Search Results</h2>  <div id="results">
    <p class="message">Search for an anime above.</p>
  </div></div><script>

async function searchAnime() {

  const input = document
    .getElementById("searchInput")
    .value
    .trim();

  const results =
    document.getElementById("results");

  if (input === "") {

    results.innerHTML =
      '<p class="message">Please enter an anime name.</p>';

    return;
  }

  results.innerHTML =
    '<p class="loading">🔄 Searching anime...</p>';

  try {

    const response = await fetch(
      `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(input)}&limit=12`
    );

    if (!response.ok) {
      throw new Error("API Error");
    }

    const data = await response.json();

    if (!data.data || data.data.length === 0) {

      results.innerHTML =
        '<p class="message">Anime not found.</p>';

      return;
    }

    results.innerHTML = "";

    data.data.forEach(anime => {

      const title =
        anime.title || "Unknown";

      const image =
        anime.images?.jpg?.image_url ||
        "";

      const genres =
        anime.genres?.map(g => g.name).join(", ") ||
        "Not available";

      const episodes =
        anime.episodes || "Unknown";

      const status =
        anime.status || "Unknown";

      const score =
        anime.score || "Not rated";

      const synopsis =
        anime.synopsis
          ? anime.synopsis.substring(0, 300) + "..."
          : "Description not available.";

      results.innerHTML += `

        <div class="card">

          ${
            image
              ? `<img class="poster" src="${image}" alt="${title}">`
              : ""
          }

          <div class="card-content">

            <h2>${title}</h2>

            <p>
              <b>⭐ Rating:</b>
              ${score}
            </p>

            <p>
              <b>🎭 Genre:</b>
              ${genres}
            </p>

            <p>
              <b>📺 Episodes:</b>
              ${episodes}
            </p>

            <p>
              <b>📅 Status:</b>
              ${status}
            </p>

            <p>
              <b>📝 About:</b>
              ${synopsis}
            </p>

          </div>

        </div>

      `;

    });

  }

  catch (error) {

    console.error(error);

    results.innerHTML = `

      <p class="message">

        ❌ Unable to load anime right now.<br>
        Please try again later.

      </p>

    `;

  }

}


document
  .getElementById("searchInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      searchAnime();

    }

  });

</script></body>
</html>
