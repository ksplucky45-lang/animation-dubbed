k<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse - Watch Full Episodes</title>
    
    <!-- CSS (Styling) -->
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background-color: #11141a; 
            color: #ffffff; 
            padding-bottom: 50px; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            background-color: #1a1f29; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }

        .logo { 
            font-size: 28px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        .logo span { 
            color: #ff4757; 
        }

        #searchInput { 
            padding: 10px 20px; 
            width: 300px; 
            border: none; 
            border-radius: 20px; 
            background-color: #2f3640; 
            color: white; 
            outline: none; 
        }

        .filters { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin: 30px 0; 
        }

        .filter-btn { 
            background-color: #2f3640; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .filter-btn.active, .filter-btn:hover { 
            background-color: #ff4757; 
        }

        .anime-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 0 5%; 
        }

        /* Card Styling */
        .anime-card {
            background-color: #1a1f29;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .anime-card:hover {
            transform: translateY(-5px);
        }
        
        .anime-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        
        .anime-info {
            padding: 15px;
        }
        
        .anime-info h3 {
            margin-bottom: 5px;
            font-size: 18px;
        }
        
        .anime-info p {
            font-size: 14px;
            color: #a4b0be;
        }

        /* Web Player Modal Styling */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.95); 
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 20px 0;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 850px;
            background-color: #1a1f29;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-anime-title {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ff4757;
        }

        /* Episode List Buttons */
        .episode-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .ep-btn {
            background-color: #2f3640;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .ep-btn.active-ep, .ep-btn:hover {
            background-color: #ff4757;
        }

        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.2s;
        }
        
        .close-btn:hover {
            color: #ff4757;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">Anime<span>Verse</span></div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search anime...">
        </div>
    </header>

    <!-- Genre Filter -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterAnime('all', event)">All</button>
        <button class="filter-btn" onclick="filterAnime('action', event)">Action</button>
        <button class="filter-btn" onclick="filterAnime('shonen', event)">Shonen</button>
        <button class="filter-btn" onclick="filterAnime('drama', event)">Drama</button>
    </div>

    <!-- Anime Grid Container -->
    <main class="anime-grid" id="animeGrid"></main>

    <!-- Web Player Box -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeVideo()">&times;</button>
            
            <!-- Video Player Window -->
            <div class="video-wrapper">
                <!-- Sandbox attribute extra popups ko rokne ke liye use kiya hai -->
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>

            <!-- Current Anime Details -->
            <h2 class="modal-anime-title" id="modalTitle">Anime Name</h2>
            <p style="font-size: 14px; margin-bottom: 10px; color: #a4b0be;">Select Episode:</p>
            
            <!-- Dynamic Episode Buttons List -->
            <div class="episode-container" id="episodeList"></div>
        </div>
    </div>

        // Display Cards
        function displayAnime(list) {
            animeGrid.innerHTML = ""; 
            if(list.length === 0) {
                animeGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No Anime Found!</p>";
                return;
            }

            list.forEach(anime => {
                const card = document.createElement('div');
                card.classList.add('anime-card');
                card.setAttribute('onclick', `openAnimePlayer("${anime.id}")`);
                card.innerHTML = `
                    <img src="${anime.image}" alt="${anime.title}" onerror="this.src='https://picsum.photos'">
                    <div class="anime-info">
                        <h3>${anime.title}</h3>
                        <p>${anime.description}</p>
                    </div>
                `;
                animeGrid.appendChild(card);
            });
        }
