<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimeVerse</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111118;
      border-bottom: 1px solid #262631;
      padding: 15px 6%;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff3d71;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover { color: #ff3d71; }

    .hero {
      padding: 65px 6%;
      text-align: center;
      background: linear-gradient(135deg, #171725, #0b0b0f);
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 60px);
      margin: 0 0 15px;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
    }

    .search-box {
      max-width: 650px;
      margin: 30px auto 0;
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: none;
      padding: 17px;
      font-size: 16px;
    }

    .search-box button {
      border: 0;
      padding: 0 25px;
      background: #ff3d71;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 88%;
      max-width: 1300px;
      margin: auto;
    }

    section { padding: 35px 0; }

    h2 {
      font-size: 25px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    .card {
      background: #17171f;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 10px 30px rgba(255, 61, 113, 0.2);
    }

    .poster {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      background: linear-gradient(135deg, #26263a, #13131c);
    }

    .info { padding: 12px; }

    .title {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 7px;
      color: #aaa;
      font-size: 13px;
    }

    .az {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .az button {
      width: 40px;
      height: 40px;
      border: 1px solid #333;
      background: #17171f;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .az button:hover,
    .az button.active {
      background: #ff3d71;
      border-color: #ff3d71;
    }

    footer {
      padding: 30px;
      text-align: center;
      background: #111118;
      color: #888;
      margin-top: 30px;
    }

    @media (max-width: 650px) {
      header { padding: 14px 4%; }
      nav { display: none; }
      .container { width: 92%; }
      .poster { height: 210px; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ANIMEVERSE</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#latest">Latest</a>
    <a href="#popular">Popular</a>
    <a href="#browse">Browse</a>
  </nav>
</header>

<div class="hero" id="home">
  <h1>Discover Your Next Anime</h1>
  <p>Search and explore your favourite anime.</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search anime...">
    <button onclick="searchAnime()">SEARCH</button>
  </div>
</div>

<main class="container">

  <section id="latest">
    <h2>🔥 Newest Drops</h2>
    <div class="grid" id="newestGrid"></div>
  </section>

  <section id="popular">
    <h2>⭐ Most Popular</h2>
    <div class="grid" id="popularGrid"></div>
  </section>

  <section>
    <h2>🎬 Anime & Animation</h2>
    <div class="grid" id="animeGrid"></div>
  </section>

  <section id="browse">
    <h2>🔤 Quick A–Z Navigation</h2>
    <div class="az" id="azButtons"></div>
  </section>

  <section>
    <h2 id="resultsTitle">🔎 Search Results</h2>
    <div class="grid" id="resultsGrid"></div>
  </section>

</main>

<footer>
  © 2026 AnimeVerse · Anime discovery website
</footer>

<script>
const animeList = [
  {name:"Naruto", type:"Series", emoji:"🍥"},
  {name:"One Piece", type:"Series", emoji:"🏴‍☠️"},
  {name:"Dragon Ball", type:"Series", emoji:"🐉"},
  {name:"Demon Slayer", type:"Series", emoji:"⚔️"},
  {name:"Jujutsu Kaisen", type:"Series", emoji:"👊"},
  {name:"Attack on Titan", type:"Series", emoji:"🛡️"},
  {name:"My Hero Academia", type:"Series", emoji:"🦸"},
  {name:"Solo Leveling", type:"Series", emoji:"⚡"},
  {name:"Death Note", type:"Series", emoji:"📓"},
  {name:"Spy x Family", type:"Series", emoji:"🕵️"},
  {name:"Haikyuu", type:"Series", emoji:"🏐"},
  {name:"Black Clover", type:"Series", emoji:"🍀"},
  {name:"Pokémon", type:"Series", emoji:"⚡"},
  {name:"Bleach", type:"Series", emoji:"🗡️"},
  {name:"Hunter x Hunter", type:"Series", emoji:"🎯"}
];

function card(item) {
  return `
    <div class="card" onclick="showDetails('${item.name.replace(/'/g, "\\'")}')">
      <div class="poster">${item.emoji}</div>
      <div class="info">
        <div class="title">${item.name}</div>
        <div class="meta">${item.type}</div>
      </div>
    </div>
  `;
}

function render(list, id) {
  document.getElementById(id).innerHTML =
    list.map(card).join("");
}

render(animeList.slice(0, 6), "newestGrid");
render(animeList.slice(3, 9), "popularGrid");
render(animeList.slice(6, 15), "animeGrid");

function searchAnime() {
  const query =
    document.getElementById("searchInput")
    .value.toLowerCase().trim();

  const results = animeList.filter(item =>
    item.name.toLowerCase().includes(query)
  );

  document.getElementById("resultsTitle").textContent =
    query ? `🔎 Results for "${query}"` : "🔎 Search Results";

  document.getElementById("resultsGrid").innerHTML =
    results.length
      ? results.map(card).join("")
      : `<p>No anime found.</p>`;

  document.getElementById("resultsGrid")
    .scrollIntoView({behavior:"smooth"});
}

document.getElementById("searchInput")
.addEventListener("keypress", function(e) {
  if (e.key === "Enter") searchAnime();
});

const letters = ["ALL", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];

document.getElementById("azButtons").innerHTML =
letters.map(letter =>
  `<button onclick="filterLetter('${letter}', this)">${letter}</button>`
).join("");

function filterLetter(letter, button) {

  document.querySelectorAll(".az button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  const results =
    letter === "ALL"
      ? animeList
      : animeList.filter(item =>
          item.name.toUpperCase().startsWith(letter)
        );

  document.getElementById("resultsTitle").textContent =
    letter === "ALL"
      ? "🔎 All Anime"
      : `🔤 Anime starting with "${letter}"`;

  document.getElementById("resultsGrid").innerHTML =
    results.length
      ? results.map(card).join("")
      : "<p>No anime found.</p>";
}

function showDetails(name) {
  alert(
    name +
    "\\n\\nThis is a demo details page. You can connect authorized content and your own database here."
  );
}
</script>

</body>
</html>
