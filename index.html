<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream & Details</title>
    
    <!-- CSS (Styling) YAHAN HAI -->
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background-color: #11141a; 
            color: #ffffff; 
            padding-bottom: 50px; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            background-color: #1a1f29; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }

        .logo { 
            font-size: 28px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        .logo span { 
            color: #ff4757; 
        }

        #searchInput { 
            padding: 10px 20px; 
            width: 300px; 
            border: none; 
            border-radius: 20px; 
            background-color: #2f3640; 
            color: white; 
            outline: none; 
        }

        .filters { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin: 30px 0; 
        }

        .filter-btn { 
            background-color: #2f3640; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .filter-btn.active, .filter-btn:hover { 
            background-color: #ff4757; 
        }

        .anime-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 0 5%; 
        }

        /* Card Styling */
        .anime-card {
            background-color: #1a1f29;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .anime-card:hover {
            transform: translateY(-5px);
        }
        
        .anime-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .anime-info {
            padding: 15px;
        }
        
        .anime-info h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .anime-info p {
            font-size: 14px;
            color: #a4b0be;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">Anime<span>Verse</span></div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search anime...">
        </div>
    </header>

    <!-- Genre Filter -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterAnime('all', event)">All</button>
        <button class="filter-btn" onclick="filterAnime('action', event)">Action</button>
        <button class="filter-btn" onclick="filterAnime('shonen', event)">Shonen</button>
        <button class="filter-btn" onclick="filterAnime('drama', event)">Drama</button>
    </div>

    <!-- Anime Grid Container -->
    <main class="anime-grid" id="animeGrid">
        <!-- Anime cards JavaScript se auto generate honge -->
    </main>

    <!-- JAVASCRIPT (Logic) YAHAN HAI -->
    <script>
        // Anime Data list
        const animeData = [
            {
                title: "Naruto Shippuden",
                genre: "shonen",
                image: "https://justwatch.com",
                description: "Naruto Uzumaki wants to become the best ninja (Hokage) in his village."
            },
            {
                title: "Attack on Titan",
                genre: "action",
                image: "https://justwatch.com",
                description: "Humans fight for survival against giant man-eating humanoids called Titans."
            },
            {
                title: "Demon Slayer",
                genre: "action",
                image: "https://justwatch.com",
                description: "Tanjiro becomes a demon slayer to save his sister and avenge his family."
            },
            {
                title: "Your Name",
                genre: "drama",
                image: "https://justwatch.com",
                description: "Two strangers find themselves linked in a bizarre way after a wish."
            }
        ];

        const animeGrid = document.getElementById('animeGrid');
        const searchInput = document.getElementById('searchInput');

        // Anime Cards generate karne ka function
        function displayAnime(list) {
            animeGrid.innerHTML = ""; // Purani list clear karein
            
            if(list.length === 0) {
                animeGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding: 20px;'>No Anime Found!</p>";
                return;
            }

            list.forEach(anime => {
                const card = document.createElement('div');
                card.classList.add('anime-card');
                card.innerHTML = `
                    <img src="${anime.image}" alt="${anime.title}">
                    <div class="anime-info">
                        <h3>${anime.title}</h3>
                        <p>${anime.description}</p>
                    </div>
                `;
                animeGrid.appendChild(card);
            });
        }

        // Filter Function (Buttons ke liye)
        function filterAnime(genre, event) {
            // Active class set karne ke liye
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(event) {
                event.target.classList.add('active');
            }

            if (genre === 'all') {
                displayAnime(animeData);
            } else {
                const filtered = animeData.filter(anime => anime.genre === genre);
                displayAnime(filtered);
            }
        }

        // Search Function
        searchInput.addEventListener('input', (e) => {
            const text = e.target.value.toLowerCase();
            const searchedAnime = animeData.filter(anime => 
                anime.title.toLowerCase().includes(text)
            );
            displayAnime(searchedAnime);
        });

        // Initial Load (Shuruat me saare dikhane ke liye)
        displayAnime(animeData);
    </script>
</body>
</html>
