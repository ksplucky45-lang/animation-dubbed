<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animation Dubbed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #1b1b1b;
      padding: 25px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 15px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 15px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffffff;
      color: #111;
      font-weight: bold;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background: #1d1d1d;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .anime-card img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      background: #222;
    }

    .anime-info {
      padding: 18px;
    }

    .anime-info h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .anime-info p {
      color: #ccc;
      line-height: 1.5;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      color: #aaa;
      font-size: 18px;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Animation Dubbed</h1>
  <p>Search for your favorite anime</p>
</header>

<div class="container">

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search anime name..."
    >

    <button onclick="searchAnime()">Search</button>
  </div>

  <h2>🔎 Search Results</h2>

  <div id="results">
    <p class="message">Search for an anime above.</p>
  </div>

</div>

<script>

async function searchAnime() {

  const input = document
    .getElementById("searchInput")
    .value
    .trim();

  const results = document.getElementById("results");


  if (input === "") {
    results.innerHTML =
      '<p class="message">Please enter an anime name.</p>';
    return;
  }


  results.innerHTML =
    '<p class="message">Loading anime...</p>';


  try {

    const response = await fetch(
      "https://api.jikan.moe/v4/anime?q=" +
      encodeURIComponent(input) +
      "&limit=10&sfw=true"
    );


    if (!response.ok) {
      throw new Error("API Error");
    }


    const data = await response.json();


    if (!data.data || data.data.length === 0) {
      results.innerHTML =
        '<p class="message">No anime found.</p>';
      return;
    }


    results.innerHTML = "";


    data.data.forEach(anime => {

      const genres = anime.genres && anime.genres.length
        ? anime.genres.map(g => g.name).join(", ")
        : "Not available";


      const image = anime.images &&
                    anime.images.jpg &&
                    anime.images.jpg.image_url
        ? anime.images.jpg.image_url
        : "";


      const description = anime.synopsis
        ? anime.synopsis
        : "No description available.";


      results.innerHTML += `

        <div class="anime-card">

          ${image ? `<img src="${image}" alt="${anime.title}">` : ""}

          <div class="anime-info">

            <h2>${anime.title}</h2>

            <p><b>Type:</b> ${anime.type || "Unknown"}</p>

            <p><b>Episodes:</b> ${anime.episodes || "Unknown"}</p>

            <p><b>Status:</b> ${anime.status || "Unknown"}</p>

            <p><b>Genre:</b> ${genres}</p>

            <p><b>Score:</b> ${anime.score || "N/A"}</p>

            <p><b>About:</b> ${description}</p>

          </div>

        </div>

      `;

    });


  } catch (error) {

    results.innerHTML = `

      <p class="message">
        Search could not load. Please try again later.
      </p>

    `;

  }

}


document
  .getElementById("searchInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      searchAnime();
    }

  });

</script>

</body>
</html>
