            background-color: #ff4757; 
        }

        .anime-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 0 5%; 
        }

        /* Card Styling */
        .anime-card {
            background-color: #1a1f29;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .anime-card:hover {
            transform: translateY(-5px);
        }
        
        .anime-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        
        .anime-info {
            padding: 15px;
        }
        
        .anime-info h3 {
            margin-bottom: 5px;
            font-size: 18px;
        }
        
        .anime-info p {
            font-size: 14px;
            color: #a4b0be;
        }

        /* Web Player Modal Styling */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.95); 
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 20px 0;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 850px;
            background-color: #1a1f29;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-anime-title {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ff4757;
        }

        /* Episode List Buttons */
        .episode-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .ep-btn {
            background-color: #2f3640;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .ep-btn.active-ep, .ep-btn:hover {
            background-color: #ff4757;
        }

        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.2s;
        }
        
        .close-btn:hover {
            color: #ff4757;
        }
    </style>
</head>

<style>

<body>

<header>
  <h1>Animation Dubbed</h1>
  <p>Search for your favorite anime</p>
</header>

<div class="container">

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search anime name..."
    >
    <button onclick="searchAnime()">Search</button>
  </div>

  <h2>🔎 Search Results</h2>

  <div id="results">
    <p class="message">Search for an anime above.</p>
  </div>

</div>

<script>

const animeList = [

{
name: "One Piece",
genre: "Action, Adventure, Fantasy",
status: "Ongoing",
episodes: "1000+",
about: "Monkey D. Luffy and his pirate crew travel the seas searching for the legendary One Piece treasure."
},

{
name: "Naruto",
genre: "Action, Adventure, Shounen",
status: "Completed",
episodes: "220",
about: "Naruto Uzumaki is a young ninja who dreams of becoming the leader of his village."
},

{
name: "Naruto Shippuden",
genre: "Action, Adventure, Shounen",
status: "Completed",
episodes: "500",
about: "Naruto continues his journey and faces powerful enemies to protect his friends and village."
},

{
name: "Dragon Ball Z",
genre: "Action, Adventure, Fantasy",
status: "Completed",
episodes: "291",
about: "Goku and his friends defend Earth from powerful enemies."
},

{
name: "Attack on Titan",
genre: "Action, Dark Fantasy",
status: "Completed",
episodes: "Multiple seasons",
about: "Humanity struggles for survival in a world threatened by Titans."
},

{
name: "Demon Slayer",
genre: "Action, Fantasy",
status: "Ongoing",
episodes: "Multiple seasons",
about: "A young boy becomes a demon slayer after his family faces tragedy."
},

{
name: "Jujutsu Kaisen",
genre: "Action, Supernatural",
status: "Ongoing",
episodes: "Multiple seasons",
about: "Students fight dangerous curses using supernatural abilities."
},

{
name: "Death Note",
genre: "Mystery, Psychological, Supernatural",
status: "Completed",
episodes: "37",
about: "A student discovers a mysterious notebook with supernatural powers."
},

{
name: "My Hero Academia",
genre: "Action, Superhero, Shounen",
status: "Completed",
episodes: "Multiple seasons",
about: "A boy without powers dreams of becoming a great hero."
},

{
name: "Bleach",
genre: "Action, Adventure, Supernatural",
status: "Completed",
episodes: "366+",
about: "Ichigo gains supernatural powers and fights dangerous spirits."
}

];


function searchAnime() {

  const input = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const results = document.getElementById("results");

  results.innerHTML = "";

  if (input === "") {
    results.innerHTML =
      '<p class="message">Please enter an anime name.</p>';
    return;
  }

  const filtered = animeList.filter(anime =>
    anime.name.toLowerCase().includes(input)
  );

  if (filtered.length === 0) {
    results.innerHTML =
      '<p class="message">Anime not found.</p>';
    return;
  }

  filtered.forEach(anime => {

    results.innerHTML += `
      <div class="card">

        <h2>${anime.name}</h2>

        <p><b>Genre:</b> ${anime.genre}</p>

        <p><b>Status:</b> ${anime.status}</p>

        <p><b>Episodes:</b> ${anime.episodes}</p>

        <p><b>About:</b> ${anime.about}</p>

      </div>
    `;

  });

}


document
  .getElementById("searchInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      searchAnime();
    }

  });

</script>
